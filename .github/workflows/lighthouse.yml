name: Lighthouse

on:
  pull_request:
  workflow_dispatch:

# Mobile, not desktop — Lighthouse's default form factor, and desktop scores
# flatter in exactly the places that matter here. Targets from the brief:
# LCP < 2.0s, CLS < 0.05, TBT < 150ms, performance 95+. Those four are hard
# failures.
#
# Accessibility is now an `error`. The exception it carried is gone: the seven
# amber-on-white pairings that failed WCAG AA were resolved by inverting the
# ground, and amber is 8.1:1 on #0E1014. `node scripts/check-contrast.mjs`
# reports the palette independently and is down to a single finding, the
# dashboard chart line at 2.85:1 — a design value awaiting a call (NOTES.md).
#
# SEO and best-practices stay warnings: 404.html is deliberately noindex, which
# the SEO category penalises and which nobody can fix in a PR.
jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Built at the site root so the audit is not measuring a base path that
      # production will not have.
      - run: npm run build
        env:
          SITE_URL: https://e2eapps.com
          SITE_BASE: /

      - name: Run Lighthouse CI
        run: |
          npm install -g @lhci/cli@0.15.x
          lhci autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-report
          path: .lighthouseci
          retention-days: 14
