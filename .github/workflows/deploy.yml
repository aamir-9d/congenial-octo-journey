name: Deploy to GitHub Pages

# One site, one branch, one deployment.
#
#   /congenial-octo-journey/   main   the live site
#
# This used to build a second copy of the site from a `redesign` branch and
# serve it at /next/. That redesign has landed on main, so the preview is gone:
# with it went the branch-dispatch job, the duplicated checkout and build, and
# a second full copy of the site competing with this one in search.
#
# Only `main` deploys. The github-pages environment has a custom branch policy
# that permits main alone, and that is worth keeping.
#
# Tests are enforced. Copy parity, the calculator's golden values and the
# "no DCLogic left" checks all read from dist/, so they run after the build —
# nothing ships with these red.
#
# Lighthouse runs on pull requests only, in its own workflow, where its hard
# gates on LCP, CLS, TBT and the performance score can block a merge. Changes
# should reach main through a PR so that check actually runs.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # A new push supersedes a running deploy.
  group: pages
  cancel-in-progress: true

env:
  # Flip these two to move to the custom domain (and add public/CNAME).
  #   SITE_URL: https://e2eapps.com
  #   SITE_BASE: /
  SITE_URL: https://aamir-9d.github.io
  SITE_BASE: /congenial-octo-journey

  # Not a secret: the browser posts here, so it is visible in any network tab.
  # The Worker is what holds the keys. Deployed from worker/ — see
  # docs/credentials.md.
  PUBLIC_FORM_ENDPOINT: https://e2e-apps-forms.e2eapps.workers.dev/submit

  # Fill these in as you create them; each stays dormant while blank.
  # PUBLIC_CALENDLY_URL: https://calendly.com/<handle>/30min
  # PUBLIC_GTM_ID: GTM-XXXXXXX
  # PUBLIC_GA4_MEASUREMENT_ID: G-XXXXXXXXXX
  # PUBLIC_GOOGLE_ADS_CONVERSION_ID: AW-XXXXXXXXX
  # PUBLIC_GOOGLE_ADS_FORM_LABEL: xxxxxxxxxxxxxxxxx
  # PUBLIC_GOOGLE_ADS_BOOKING_LABEL: xxxxxxxxxxxxxxxxx

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # `npm run build` ends by pruning the internal review artifacts — /audit,
      # /brand-book and /logo-directions — out of dist. They stay in the repo
      # and still serve under `npm run dev`; they are just not part of the
      # public site. See scripts/prune-internal.mjs.
      - run: npm run build

      - run: npm test

      - name: Contrast audit
        run: node scripts/check-contrast.mjs || true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    # Pages has no native PR previews; PRs build and test only. The artifact
    # from the build job is downloadable from the run summary for review.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
